name: Publish Proteus

on:
  push:
    branches: [av]
  pull_request:
    branches: [av]

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-wasm:
    name: Build WASM
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6.0.2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo registry & build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            crates/parser-wasm/target
          key: cargo-${{ runner.os }}-${{ hashFiles('crates/parser-wasm/Cargo.toml') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Install wasm-pack
        run: command -v wasm-pack || cargo install wasm-pack --locked

      - name: Verify version consistency
        run: |
          NPM_VERSION=$(jq -r .version package.json)
          JSR_VERSION=$(jq -r .version jsr.json)
          if [ "$NPM_VERSION" != "$JSR_VERSION" ]; then
            echo "::error::Version mismatch: package.json=$NPM_VERSION, jsr.json=$JSR_VERSION"
            exit 1
          fi
          echo "Version consistent: $NPM_VERSION"

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.9"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build WASM
        run: bun run build:wasm

      - name: Remove wasm-pack generated .gitignore
        run: rm -f pkg/.gitignore

      - name: Upload WASM artifact
        uses: actions/upload-artifact@v4
        with:
          name: wasm-pkg
          path: pkg/
          retention-days: 1

  test-bun:
    name: Test (Bun)
    needs: [build-wasm]
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6.0.2

      - name: Download WASM artifact
        uses: actions/download-artifact@v4
        with:
          name: wasm-pkg
          path: pkg/

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.9"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun run test

      - name: Lint
        run: bun run lint

  test-deno:
    name: Test (Deno)
    needs: [build-wasm]
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6.0.2

      - name: Download WASM artifact
        uses: actions/download-artifact@v4
        with:
          name: wasm-pkg
          path: pkg/

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: "2.6.9"

      - name: Cache Deno dependencies
        run: deno install

      - name: Type-check core library (Deno)
        run: deno task check

      - name: Run Deno tests
        run: deno task test

  publish-jsr:
    name: Publish to JSR
    needs: [test-bun, test-deno]
    if: github.event_name == 'push' && github.ref == 'refs/heads/av'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v6.0.2

      - name: Download WASM artifact
        uses: actions/download-artifact@v4
        with:
          name: wasm-pkg
          path: pkg/

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: "2.6.9"

      - name: Check if version exists on JSR
        id: jsr_check
        run: |
          SCOPE=$(jq -r .name jsr.json | cut -d'/' -f1 | tr -d '@')
          PACKAGE=$(jq -r .name jsr.json | cut -d'/' -f2)
          VERSION=$(jq -r .version jsr.json)
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://jsr.io/@${SCOPE}/${PACKAGE}/${VERSION}_meta.json")
          if [ "$HTTP_STATUS" = "200" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to JSR
        if: steps.jsr_check.outputs.exists == 'false'
        run: deno publish --allow-dirty --config jsr.json

  release:
    name: GitHub Release
    needs: [publish-jsr]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6.0.2

      - name: Extract version
        id: version
        run: |
          VERSION=$(jq -r .version package.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if tag exists
        id: tag_check
        env:
          TAG_VERSION: ${{ steps.version.outputs.version }}
        run: |
          if git ls-remote --tags origin "refs/tags/v${TAG_VERSION}" | grep -q .; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create tag
        if: steps.tag_check.outputs.exists == 'false'
        env:
          TAG_NAME: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG_NAME" -m "Release $TAG_NAME"
          git push origin "$TAG_NAME"

      - name: Create GitHub Release
        if: steps.tag_check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG_NAME" \
            --title "$TAG_NAME" \
            --generate-notes