name: CI & Publish

on:
  push:
    branches: [av]
    tags: ["v*"]
  pull_request:
    branches: [av]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to JSR & Release"
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: "1.3.11"
  DENO_VERSION: "2.7.7"

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Verify version consistency
        run: |
          for f in packages/proteus/package.json packages/proteus/jsr.json; do
            [ -f "$f" ] || { echo "::error::Missing $f"; exit 1; }
          done
          NPM_VERSION=$(jq -r .version packages/proteus/package.json)
          JSR_VERSION=$(jq -r .version packages/proteus/jsr.json)
          if [ "$NPM_VERSION" != "$JSR_VERSION" ]; then
            echo "::error::Version mismatch: package.json=$NPM_VERSION, jsr.json=$JSR_VERSION"
            exit 1
          fi
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG_VERSION="${GITHUB_REF#refs/tags/v}"
            if [ "$NPM_VERSION" != "$TAG_VERSION" ]; then
              echo "::error::Tag $TAG_VERSION ≠ package version $NPM_VERSION"
              exit 1
            fi
          fi
          echo "Version consistent: $NPM_VERSION"

  build-wasm:
    name: Build WASM
    needs: [preflight]
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Cache Cargo registry & build
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            crates/parser-wasm/target
          key: cargo-wasm-${{ runner.os }}-${{ hashFiles('crates/parser-wasm/Cargo.lock') }}
          restore-keys: cargo-wasm-${{ runner.os }}-

      - name: Install wasm-pack
        run: command -v wasm-pack || cargo install wasm-pack --locked

      - name: Install Bun
        uses: oven-sh/setup-bun@ecf28ddc73e819eb6fa29df6b34ef8921c743461 # v2.1.3
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build WASM
        run: bun run build:wasm

      - name: Verify WASM artifact contents
        run: |
          test -f packages/proteus/pkg/proteus_wasm.js
          test -f packages/proteus/pkg/proteus_wasm_bg.js
          test -f packages/proteus/pkg/proteus_wasm_bg.wasm

      - name: Remove wasm-pack generated .gitignore
        run: rm -f packages/proteus/pkg/.gitignore

      - name: Upload WASM artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: wasm-pkg
          path: packages/proteus/pkg/
          retention-days: 1

  test-bun:
    name: Test (Bun)
    needs: [build-wasm]
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Download WASM artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wasm-pkg
          path: packages/proteus/pkg/

      - name: Install Bun
        uses: oven-sh/setup-bun@ecf28ddc73e819eb6fa29df6b34ef8921c743461 # v2.1.3
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun run test

      - name: Lint
        run: bun run lint

  test-deno:
    name: Test (Deno)
    needs: [build-wasm]
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Download WASM artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wasm-pkg
          path: packages/proteus/pkg/

      - name: Install Bun
        uses: oven-sh/setup-bun@ecf28ddc73e819eb6fa29df6b34ef8921c743461 # v2.1.3
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Deno
        uses: denoland/setup-deno@e95548e56dfa95d4e1a28d6f422fafe75c4c26fb # v2.0.3
        with:
          deno-version: ${{ env.DENO_VERSION }}

      - name: Type-check core library (Deno)
        run: bun run typecheck:deno

      - name: Run Deno tests
        run: bun run test:deno

  test-rust:
    name: Test (Rust)
    needs: [preflight]
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable

      - name: Cache Cargo registry & build
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/parser-wasm/target
          key: cargo-test-${{ runner.os }}-${{ hashFiles('crates/parser-wasm/Cargo.lock') }}
          restore-keys: cargo-test-${{ runner.os }}-

      - name: Run Rust unit tests
        working-directory: crates/parser-wasm
        run: cargo test

  test-worker:
    name: Test (Worker)
    needs: [build-wasm]
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Download WASM artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wasm-pkg
          path: packages/proteus/pkg/

      - name: Install Bun
        uses: oven-sh/setup-bun@ecf28ddc73e819eb6fa29df6b34ef8921c743461 # v2.1.3
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Worker integration tests
        run: bun run test:worker

  publish-jsr:
    name: Publish to JSR
    needs: [test-bun, test-deno, test-rust, test-worker]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Download WASM artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wasm-pkg
          path: packages/proteus/pkg/

      - name: Install Deno
        uses: denoland/setup-deno@e95548e56dfa95d4e1a28d6f422fafe75c4c26fb # v2.0.3
        with:
          deno-version: ${{ env.DENO_VERSION }}

      - name: Check if version exists on JSR
        id: jsr_check
        working-directory: packages/proteus
        run: |
          SCOPE=$(jq -r .name jsr.json | cut -d'/' -f1 | tr -d '@')
          PACKAGE=$(jq -r .name jsr.json | cut -d'/' -f2)
          VERSION=$(jq -r .version jsr.json)
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://jsr.io/@${SCOPE}/${PACKAGE}/${VERSION}_meta.json")
          if [ "$HTTP_STATUS" = "200" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif [ "$HTTP_STATUS" = "404" ]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Unexpected JSR response: HTTP $HTTP_STATUS"
            exit 1
          fi

      - name: Publish to JSR
        if: steps.jsr_check.outputs.exists == 'false'
        working-directory: packages/proteus
        run: deno publish --allow-dirty --config jsr.json

  release:
    name: GitHub Release
    needs: [publish-jsr]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Resolve tag name
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            VERSION=$(jq -r .version packages/proteus/package.json)
            echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          fi

      - name: Check if release already exists
        id: release_check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.version.outputs.tag }}
        run: |
          set +e
          gh release view "$TAG_NAME" &>/dev/null
          rc=$?
          set -e
          if [ $rc -eq 0 ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif [ $rc -eq 1 ]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::gh release view failed (exit $rc)"
            exit 1
          fi

      - name: Create GitHub Release
        if: steps.release_check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG_NAME" \
            --title "$TAG_NAME" \
            --target "$GITHUB_SHA" \
            --generate-notes
