[package]
name = "quill-matter-wasm"
version = "0.1.1"
edition = "2021"
description = "WASM-compiled parsers for YAML, JSON, and TOML front matter"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = { version = "0.0.19", default-features = false }
toml = "0.8"
serde-wasm-bindgen = "0.6"

[profile.release]
opt-level = "s"
lto = true
strip = "debuginfo"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Os", "--strip-debug"]
